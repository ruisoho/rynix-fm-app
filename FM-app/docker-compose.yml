version: '3.8'

services:
  app:
    build: .
    container_name: fm_app
    restart: always
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - .:/var/www/html
      - fm_data:/var/www/html/data
      - fm_uploads:/var/www/html/uploads
    environment:
      - DB_PATH=/var/www/html/data/database.sqlite

volumes:
  fm_data:
  fm_uploads:
